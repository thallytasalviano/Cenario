<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cenário do Jogo</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>🏃 Endless Runner</h1>

        <p>Cenário do Jogo</p>
    </header>

    <main>

        <section class="introducao">
            <h2>Cenário</h2>

            <p>
                Um cenário simples com céu azul,
                nuvens, árvores e grama.
            </p>
        </section>


        <section class="cena">

            <!-- SOL -->
            <div class="sol"></div>


            <!-- NUVENS -->
            <div class="nuvem nuvem1"></div>

            <div class="nuvem nuvem2"></div>


            <!-- ÁRVORES -->
            <div class="arvore arvore1">
                <div class="tronco"></div>
                <div class="copa"></div>
            </div>

            <div class="arvore arvore2">
                <div class="tronco"></div>
                <div class="copa"></div>
            </div>

            <div class="arvore arvore3">
                <div class="tronco"></div>
                <div class="copa"></div>
            </div>


            <!-- GRAMA -->
            <div class="grama"></div>

        </section>


        <section class="informacao">

            <span class="destaque">Objetivo:</span>

            apresentar um cenário simples
            para o jogo.

        </section>

    </main>

</body>

</html>
