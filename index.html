
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventura da Princesa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>👑 Aventura da Princesa 👑</h1>

    <div class="painel">
        <span>Pontos: <strong id="pontos">0</strong></span>
        <span id="vidas">❤️❤️❤️</span>
    </div>

    <div class="cenario" id="cenario">
        <div id="personagem" aria-label="Princesa">
    <div class="coroa">👑</div>
    <div class="cabeca">
        <div class="cabelo"></div>
        <div class="rosto">
            <span class="olhos">◼ ◼</span>
            <span class="boca">▪</span>
        </div>
    </div>
    <div class="corpo"></div>
    <div class="braco braco-esquerdo"></div>
    <div class="braco braco-direito"></div>
    <div class="perna perna-esquerda"></div>
    <div class="perna perna-direita"></div>
</div>

    <div class="botoes">
        <button id="iniciar">Começar jogo</button>
        <button id="pular">Pular! ⬆️</button>
    </div>

    <!-- Carrega o JavaScript. O nome precisa ser igual ao do arquivo. -->
    <script src="Script.js"></script>
</body>
</html>
